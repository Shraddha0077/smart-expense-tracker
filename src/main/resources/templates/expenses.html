<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Expenses</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h2 class="text-center mb-4">Expense List</h2>

    <!-- Navigation Buttons -->
    <div class="mb-4">

        <a th:href="@{/}" class="btn btn-dark">
            Dashboard
        </a>

        <a th:href="@{/expenses/add}" class="btn btn-success">
            Add Expense
        </a>

        <a th:href="@{/categories}" class="btn btn-primary">
            Manage Categories
        </a>

    </div>

    <!-- Search -->
    <div class="row mb-3">

        <div class="col-md-6">

            <form th:action="@{/expenses/search}" method="get">

                <div class="input-group">

                    <input
                            type="text"
                            name="keyword"
                            class="form-control"
                            placeholder="Search expense by title">

                    <button class="btn btn-primary" type="submit">
                        Search
                    </button>

                </div>

            </form>

        </div>

    </div>

    <!-- Filter -->
    <div class="row mb-4">

        <div class="col-md-6">

            <form th:action="@{/expenses/filter}" method="get">

                <div class="input-group">

                    <select class="form-select"
                            name="categoryId"
                            required>

                        <option value="">Select Category</option>

                        <option th:each="category : ${categories}"
                                th:value="${category.id}"
                                th:text="${category.name}">
                        </option>

                    </select>

                    <button class="btn btn-success" type="submit">
                        Filter
                    </button>

                    <a th:href="@{/expenses}"
                       class="btn btn-secondary">
                        Show All
                    </a>

                </div>

            </form>

        </div>

    </div>

    <!-- Expense Table -->

    <table class="table table-bordered table-hover">

        <thead class="table-dark">

        <tr>

            <th>ID</th>
            <th>Title</th>
            <th>Amount (₹)</th>
            <th>Date</th>
            <th>Category</th>
            <th>Description</th>
            <th>Actions</th>

        </tr>

        </thead>

        <tbody>

        <tr th:each="expense : ${expenses}">

            <td th:text="${expense.id}"></td>

            <td th:text="${expense.title}"></td>

            <td th:text="${expense.amount}"></td>

            <td th:text="${expense.expenseDate}"></td>

            <td th:text="${expense.category.name}"></td>

            <td th:text="${expense.description}"></td>

            <td>

                <a th:href="@{/expenses/edit/{id}(id=${expense.id})}"
                   class="btn btn-warning btn-sm">
                    Edit
                </a>

                <a th:href="@{/expenses/delete/{id}(id=${expense.id})}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Are you sure you want to delete this expense?')">
                    Delete
                </a>

            </td>

        </tr>

        <tr th:if="${#lists.isEmpty(expenses)}">

            <td colspan="7" class="text-center">

                No expenses found.

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>

</html>
